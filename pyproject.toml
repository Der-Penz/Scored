[project]
name = "scored"
version = "0.1.0"
description = "Single camera dart scoring system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gui",
    "opencv-python>=4.13.0.92",
]

[tool.uv.workspace]
members = [
    "scored_lib",
    "gui",
    "nn",
]

[tool.uv.sources]
gui = { workspace = true }

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Selected rule suites
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting replacement)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (upgrades code to Python 3.13+ syntax)
    "SIM",  # flake8-simplify
    "LOG",  # flake8-logging
    "T10",  # flake8-debugger (breakpoint / pdb)
]
ignore = ["LOG015"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
# Formatter settings replacing Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
