[tool.poetry]
name = "monorepo-dev"
version = "0.0.0"
description = "Dev dependencies for the scored monorepo"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"

[tool.poetry.group.dev.dependencies]
black = "25.1.0"
isort = "6.0.1"
pyright = "1.1.403"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
known_first_party = ["scored", "gui", "ml"]

[tool.poetry.scripts]
lint = "pyright"
format = "black"
sort = "isort"