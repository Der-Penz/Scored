# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (--fix)
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
