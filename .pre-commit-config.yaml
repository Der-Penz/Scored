# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (--fix)
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
