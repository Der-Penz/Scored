[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "scored-ML"
version = "0.0.0"
description = "Automatic dart scoring system for single camera setup"
authors = ["DerPenz"]
license = "MIT"
readme = "README.md"
keywords = ["cv", "dart", "scoring", "yolo"]

[tool.poetry.dependencies]
python = ">=3.11"

[[tool.poetry.packages]]
include = "ml"