[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "scored-ML"
version = "0.0.0"
description = "Automatic dart scoring system for single camera setup"
authors = ["DerPenz"]
license = "MIT"
readme = "README.md"
keywords = ["cv", "dart", "scoring", "yolo"]

[tool.poetry.dependencies]
python = ">=3.11"
numpy = "^2.3.2"
imgaug = "^0.4.0"
matplotlib = "^3.10.5"
ultralytics = "^8.3.181"
pandas = "^2.3.1"
dotenv = "^0.9.9"
scored-lib = {path = "../lib", develop = true}

[[tool.poetry.packages]]
include = "ml"

[tool.poetry.scripts]
eval = "ml.scripts.eval:main"
dataset = "ml.scripts.dataset:main"