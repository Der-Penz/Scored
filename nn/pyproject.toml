[project]
name = "nn"
version = "0.1.0"
description = "nn training and inference library for scored"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "opencv-python>=4.13.0.92",
    "pytorch-lightning>=2.6.6",
    "scikit-image>=0.26.0",
    "scored-lib",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tyro>=1.0.16",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
scored-lib = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[project.scripts]
dataset = "dataset.generate_dataset:main"